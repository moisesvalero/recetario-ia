name: Database Keep Alive

on:
  schedule:
    # Se ejecuta cada 6 horas para asegurar actividad constante y evitar la pausa por inactividad en Appwrite Cloud
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Appwrite Keep-Alive Heartbeat
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          PUBLIC_APPWRITE_ENDPOINT: "https://fra.cloud.appwrite.io/v1"
          PUBLIC_APPWRITE_PROJECT_ID: "6a4b6de7000edc879709"
          PUBLIC_APPWRITE_DATABASE_ID: "recetario"
          PUBLIC_APPWRITE_COLLECTION_RECETAS: "recetas_guardadas"
        run: node scripts/db-keep-alive.mjs
